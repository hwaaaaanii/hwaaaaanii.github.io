# Private visitor analytics for the homepage.
#
# The count is never shown on the page. Visitors see nothing; the numbers only
# appear on the GoatCounter dashboard, which needs a login.
#
# To turn it on:
#   1. Sign up at https://www.goatcounter.com  (free, no card)
#      Pick a site code, for example  hwaaaaanii
#   2. Put that code on the line below, replacing the empty value
#   3. cd homepage-src && ./build.sh ../index.html && cd .. && git add -A
#      && git commit -m "Enable analytics" && git push
#
# Leave it empty and no script is emitted at all, so the page keeps making zero
# external requests. Nothing breaks either way.
#
# Your dashboard will then be at  https://<code>.goatcounter.com
#
# To stop counting your own visits, open the site in your browser, open the
# console and run:  localStorage.setItem('skipgc', 't')
# Do that once per browser you use.

GOATCOUNTER_CODE=hwaaaaanii
